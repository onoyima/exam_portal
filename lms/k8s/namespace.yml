apiVersion: v1
kind: Namespace
metadata:
  name: veritas-lms
  labels:
    name: veritas-lms
    environment: production
    managed-by: terraform
    team: platform-engineering
  annotations:
    description: "Veritas University Integrated Learning Management System"
    contact: "devops@veritas.edu.ng"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: veritas-lms-limits
  namespace: veritas-lms
spec:
  limits:
    - default:
        memory: 512Mi
        cpu: 500m
      defaultRequest:
        memory: 256Mi
        cpu: 250m
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: veritas-lms-quota
  namespace: veritas-lms
spec:
  hard:
    requests.cpu: 10
    requests.memory: 20Gi
    limits.cpu: 30
    limits.memory: 60Gi
    pods: 50
    services: 10
    persistentvolumeclaims: 5
