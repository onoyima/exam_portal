apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-app
  namespace: veritas-lms
  labels:
    app: veritas-lms
    tier: backend
    component: app
  annotations:
    description: "Next Gen LMS PHP application server"
    deployment-strategy: "rolling-update"
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: veritas-lms
      tier: backend
      component: app
  template:
    metadata:
      labels:
        app: veritas-lms
        tier: backend
        component: app
      annotations:
        checksum/config: "lms-config"
        checksum/secrets: "lms-secrets"
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: reg-credentials
      containers:
        - name: php-app
          image: veritasuniversity/lms:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lms-config
            - secretRef:
                name: lms-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 80
              httpHeaders:
                - name: X-Health-Check
                  value: "true"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/lms/storage
              subPath: storage
            - name: tmp
              mountPath: /tmp
            - name: sessions
              mountPath: /var/lib/php/sessions
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 33
            runAsGroup: 33
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: lms-storage-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: sessions
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - veritas-lms
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/application
                    operator: In
                    values:
                      - "true"
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "lms"
          effect: "NoSchedule"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lms-storage-pvc
  namespace: veritas-lms
  labels:
    app: veritas-lms
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-client
