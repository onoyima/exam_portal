apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-ingress
  namespace: veritas-lms
  labels:
    app: veritas-lms
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lms.veritas.edu.ng,https://portal.veritas.edu.ng"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst: "150"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - lms.veritas.edu.ng
      secretName: lms-tls
  rules:
    - host: lms.veritas.edu.ng
      http:
        paths:
          - path: /lms
            pathType: Prefix
            backend:
              service:
                name: lms-app-service
                port:
                  number: 80
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: lms-app-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-app-service
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lms-tls-cert
  namespace: veritas-lms
  labels:
    app: veritas-lms
    component: tls
spec:
  secretName: lms-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: lms.veritas.edu.ng
  dnsNames:
    - lms.veritas.edu.ng
    - "*.lms.veritas.edu.ng"
