version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  veritas-lms:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  minio_data:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-lms-app
    image: veritas/lms-app:latest
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/lms
      - ../exam-portal:/var/www/html/exam-portal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_BASE_PATH: /exam_portal/lms/public

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lms_db
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_dev_pass

      EXEAT2_DB_HOST: mysql
      EXEAT2_DB_PORT: 3306
      EXEAT2_DB_DATABASE: exeat2_db
      EXEAT2_DB_USERNAME: lms_user
      EXEAT2_DB_PASSWORD: lms_dev_pass

      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_TTL: 3600

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      MAIL_DRIVER: log
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: lms@veritas.edu.ng
      MAIL_FROM_NAME: "Next Gen LMS"

      LMS_NAME: "Veritas Learning Management System"
      LMS_VERSION: 1.0.0
      LMS_TIMEZONE: Africa/Lagos
      LMS_LOCALE: en
      LMS_STORAGE_DRIVER: local
      LMS_STORAGE_PATH: /var/www/html/lms/storage/media
      LMS_LOG_LEVEL: debug
      LMS_LOG_CHANNEL: stack
      LMS_CACHE_DRIVER: redis
      LMS_SESSION_DRIVER: redis
      LMS_QUEUE_DRIVER: sync
      LMS_PAGINATION_PER_PAGE: 20
      LMS_MAX_UPLOAD_SIZE: 104857600
      LMS_ALLOWED_FILE_TYPES: pdf,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,gif,mp4,webm,zip

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: lms_user
      RABBITMQ_PASS: lms_dev_pass
      RABBITMQ_VHOST: lms_vhost
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: veritas-lms-mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_dev_pass
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=256M
      --max_connections=500
      --max_allowed_packet=64M
      --slow_query_log=1
      --long_query_time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: veritas-lms-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: veritas-lms-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - tools

  rabbitmq:
    image: rabbitmq:3-management
    container_name: veritas-lms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lms_user
      RABBITMQ_DEFAULT_PASS: lms_dev_pass
      RABBITMQ_DEFAULT_VHOST: lms_vhost
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: veritas-lms-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - search

  minio:
    image: minio/minio:latest
    container_name: veritas-lms-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: lms_admin
      MINIO_ROOT_PASSWORD: lms_dev_pass
      MINIO_DEFAULT_BUCKETS: lms-media
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - veritas-lms
    logging: *default-logging
    restart: unless-stopped
