user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Base paths
    set $lms_root /var/www/html/exam_portal/lms/public;
    set $exam_portal_root /var/www/html/exam_portal;

    # Logging
    log_format lms_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
    '}';

    access_log /var/log/nginx/access.log lms_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    client_max_body_size 110m;
    client_body_buffer_size 128k;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=lms_login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=lms_api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=lms_static:10m rate=500r/s;
    limit_req_zone $http_x_forwarded_for zone=lms_exam_webhook:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=lms_conn:10m max_connections=50;
    limit_conn_log_level warn;
    limit_conn_status 429;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # Upstream PHP-FPM
    upstream php-fpm {
        server unix:/var/run/php/php8.2-fpm.sock weight=5 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:9000 weight=3 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name lms.veritas.edu.ng portal.veritas.edu.ng;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name lms.veritas.edu.ng;

        # SSL configuration
        ssl_certificate /etc/ssl/certs/veritas-lms.crt;
        ssl_certificate_key /etc/ssl/private/veritas-lms.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Correlation ID
        add_header X-Request-ID $request_id always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://code.jquery.com https://stackpath.bootstrapcdn.com;
            style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://stackpath.bootstrapcdn.com;
            img-src 'self' data: blob: https: http:;
            font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com;
            connect-src 'self' ws: wss: https: http:;
            media-src 'self' blob: https: http:;
            frame-src 'self' https://www.youtube.com https://player.vimeo.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
        " always;

        # Root for LMS
        root $lms_root;
        index index.php;

        # Request ID
        set $request_id $request_id;

        # ==========================================
        # LMS Routes
        # ==========================================

        # Static assets with aggressive caching
        location ~* ^/exam_portal/lms/public/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            add_header X-Frame-Options "SAMEORIGIN" always;
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # Media files with caching
        location ~* ^/exam_portal/lms/storage/media/ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Favicon and robots
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /robots.txt {
            log_not_found off;
            access_log off;
            try_files $uri =404;
        }

        # Health check endpoints (no rate limiting)
        location ~ ^/api/v1/health {
            access_log off;
            limit_req off;
            try_files $uri /index.php?$query_string;
        }

        # API rate limiting
        location /api/v1/ {
            limit_req zone=lms_api burst=150 nodelay;
            limit_conn lms_conn 50;

            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://lms.veritas.edu.ng";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID, X-API-Version";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            try_files $uri /index.php?$query_string;
        }

        # Login rate limiting (strict)
        location = /api/v1/auth/login {
            limit_req zone=lms_login burst=10 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # Exam Portal webhook receiver
        location = /api/v1/exam-bridge/webhook {
            limit_req zone=lms_exam_webhook burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # PHP-FPM passthrough for all LMS requests
        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param APP_ENV production;
            fastcgi_param APP_BASE_PATH /exam_portal/lms/public;

            # FastCGI buffering
            fastcgi_buffering on;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_connect_timeout 10;
            fastcgi_send_timeout 60;
            fastcgi_read_timeout 60;

            # Pass request ID
            fastcgi_param HTTP_X_REQUEST_ID $request_id;

            include fastcgi_params;
        }

        # ==========================================
        # Exam Portal Reverse Proxy
        # ==========================================
        location /exam-portal/ {
            proxy_pass http://exam-portal-backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_busy_buffers_size 256k;
            proxy_connect_timeout 10;
            proxy_send_timeout 60;
            proxy_read_timeout 60;

            # Remove base path prefix before forwarding
            rewrite ^/exam-portal/(.*)$ /$1 break;

            # CORS headers for proxied requests
            add_header Access-Control-Allow-Origin "https://lms.veritas.edu.ng" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }

        # Deny access to sensitive paths
        location ~ /\.(env|git|svn|htaccess|htpasswd|idea|vscode|DS_Store) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~ /(config|database|routes|src|storage/logs|vendor|composer\.(json|lock)) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Fallback: route everything through index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;

            # HTML caching (short TTL)
            location ~* \.(html|htm)$ {
                expires 1h;
                add_header Cache-Control "public, no-cache";
            }
        }

        # Error pages
        error_page 404 /index.php?error=404;
        error_page 403 /index.php?error=403;
        error_page 429 /index.php?error=429;
        error_page 500 502 503 504 /index.php?error=500;

        # OCSP stapling
        location /ocsp {
            internal;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
