[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/lms/storage/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/run/supervisord.pid
childlogdir=/var/www/html/lms/storage/logs
minfds=1024
minprocs=200

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[inet_http_server]
port=127.0.0.1:9001
username=lms_admin
password=CHANGE_ME_SUPERVISOR_PASS

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# ==========================================
# LMS Queue Workers
# ==========================================

# Mail Queue Worker
# Handles email notifications: password resets, grade alerts, announcements, etc.
[program:lms-mail-worker]
command=php /var/www/html/lms/src/Core/QueueWorker.php --queue=mail --max-jobs=100 --sleep=3
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/html/lms
autostart=true
autorestart=true
startsecs=5
startretries=5
exitcodes=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/www/html/lms/storage/logs/mail-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB
stderr_logfile=/var/www/html/lms/storage/logs/mail-worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
stderr_capture_maxbytes=1MB
environment=
    APP_ENV="production",
    QUEUE_DRIVER="rabbitmq",
    QUEUE_CONNECTION="mail",
    REDIS_HOST="localhost",
    REDIS_PORT="6379"

# Sync Queue Worker
# Handles Exam Portal synchronization: course sync, enrollment sync, grade push.
# Also handles general data synchronization tasks.
[program:lms-sync-worker]
command=php /var/www/html/lms/src/Core/QueueWorker.php --queue=sync --max-jobs=50 --sleep=2
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/html/lms
autostart=true
autorestart=true
startsecs=5
startretries=5
exitcodes=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/www/html/lms/storage/logs/sync-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB
stderr_logfile=/var/www/html/lms/storage/logs/sync-worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
stderr_capture_maxbytes=1MB
environment=
    APP_ENV="production",
    QUEUE_DRIVER="rabbitmq",
    QUEUE_CONNECTION="sync",
    REDIS_HOST="localhost",
    REDIS_PORT="6379",
    EXAM_PORTAL_URL="https://portal.veritas.edu.ng"

# Event Queue Worker
# Handles domain events: course.created, enrollment.completed, quiz.graded, etc.
# Routes to appropriate handlers based on event type.
[program:lms-event-worker]
command=php /var/www/html/lms/src/Core/QueueWorker.php --queue=events --max-jobs=100 --sleep=1
process_name=%(program_name)s_%(process_num)02d
numprocs=1
directory=/var/www/html/lms
autostart=true
autorestart=true
startsecs=5
startretries=5
exitcodes=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/www/html/lms/storage/logs/event-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB
stderr_logfile=/var/www/html/lms/storage/logs/event-worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
stderr_capture_maxbytes=1MB
environment=
    APP_ENV="production",
    QUEUE_DRIVER="rabbitmq",
    QUEUE_CONNECTION="events",
    REDIS_HOST="localhost",
    REDIS_PORT="6379"

# ==========================================
# Group for managing all workers together
# ==========================================
[group:lms-workers]
programs=lms-mail-worker,lms-sync-worker,lms-event-worker

# ==========================================
# Event Listener for notifications
# ==========================================
[eventlistener:process-monitor]
command=php /var/www/html/lms/src/Core/ProcessMonitor.php
process_name=%(program_name)s_%(process_num)02d
numprocs=1
events=PROCESS_STATE,TICK_60
buffer_size=100
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
exitcodes=0,2
stderr_logfile=/var/www/html/lms/storage/logs/process-monitor-error.log
stdout_logfile=/var/www/html/lms/storage/logs/process-monitor.log
user=www-data
